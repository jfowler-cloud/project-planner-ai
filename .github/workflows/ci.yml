name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run test:coverage
        working-directory: apps/web

  functions:
    name: Functions (Lambda handlers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: cd apps/functions && uv sync --all-extras
      - run: cd apps/functions && uv run ruff check .
      - run: cd apps/functions && uv run pytest tests/

  agents:
    name: Agents (shared utilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: cd apps/agents && uv sync --all-extras
      - run: cd apps/agents && uv run pytest tests/

  infrastructure:
    name: Infrastructure (CDK synth + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/infra && npm ci
      - name: Set up QEMU for ARM64 Docker builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: cd apps/infra && npx cdk synth
      - run: cd apps/infra && npm test

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm audit --audit-level=high
        working-directory: apps/web
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12

      - name: pip-audit (functions)
        run: cd apps/functions && uv sync --group dev && uv run pip-audit

      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript
      - uses: github/codeql-action/analyze@v4
