name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.12
    
    - name: Install dependencies
      working-directory: apps/backend
      run: |
        uv sync
        uv pip install -e ".[dev]"
    
    - name: Run tests
      working-directory: apps/backend
      env:
        AI_PROVIDER: anthropic
        DEPLOYMENT_TIER: testing
      run: uv run pytest --cov=src --cov-report=xml
    
    - name: Lint
      working-directory: apps/backend
      run: uv run ruff check src/ || echo "Ruff not configured, skipping"
    
    - name: Type check
      working-directory: apps/backend
      run: uv run mypy src/ || echo "Mypy not configured, skipping"

  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      working-directory: apps/web
      run: npm install
    
    - name: Lint
      working-directory: apps/web
      run: npm run lint

    - name: Test
      working-directory: apps/web
      run: npm test -- --passWithNoTests

    - name: Build
      working-directory: apps/web
      run: npm run build
