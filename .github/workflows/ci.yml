name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm ci
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/web && npm run test:coverage

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: cd apps/backend && uv sync
      - run: cd apps/backend && uv run ruff check src/
      - run: cd apps/backend && uv run pytest tests/
        env:
          AI_PROVIDER: anthropic
          DEPLOYMENT_TIER: testing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm ci && npm audit --audit-level=high
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: cd apps/backend && uv sync && uv run pip-audit
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - uses: github/codeql-action/analyze@v3
